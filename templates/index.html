<!DOCTYPE html>
<html lang="en">
<head>
<title>Business AI Login</title>

<style>
:root {
  --primary: #5b56f5;
  --primary-dark: #4338ca;
  --secondary: #7c3aed;
  --bg: #eef2ff;
  --surface: #ffffff;
  --surface-alt: #f8fafc;
  --text: #111827;
  --text-muted: #6b7280;
  --border: #dbeafe;
  --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, rgba(99, 102, 241, 0.18), transparent 35%),
              linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 2.5rem 2.5rem 2rem;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow);
}

.logo {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.5rem;
}

.logo svg {
  width: 26px;
  height: 26px;
  fill: white;
}

h2 {
  font-size: 1.35rem;
  font-weight: 700;
  text-align: center;
  margin-bottom: 0.25rem;
}

.sub {
  font-size: 0.95rem;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 1.75rem;
}

.tab-bar {
  display: flex;
  gap: 0.4rem;
  background: var(--surface-alt);
  border-radius: 14px;
  padding: 4px;
  margin-bottom: 1.75rem;
}

.tab {
  flex: 1;
  text-align: center;
  padding: 0.85rem 0;
  font-size: 0.9rem;
  font-weight: 500;
  border-radius: 12px;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.2s ease;
}

.tab.active {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
  font-weight: 700;
}

.field {
  margin-bottom: 1rem;
}

label {
  display: block;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

input[type=text],
input[type=password] {
  width: 100%;
  padding: 0.95rem 1rem;
  font-size: 0.95rem;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface-alt);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input:focus {
  border-color: rgba(91, 86, 245, 0.6);
  box-shadow: 0 0 0 5px rgba(91, 86, 245, 0.08);
}

input::placeholder {
  color: #94a3b8;
}

.btn-primary {
  width: 100%;
  padding: 0.95rem 1rem;
  font-size: 0.95rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  margin-top: 0.75rem;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 28px rgba(91, 86, 245, 0.22);
}

.btn-primary:active {
  transform: translateY(0);
}

.divider {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 1.5rem 0;
}

.divider span {
  font-size: 0.8rem;
  color: #94a3b8;
}

.divider hr {
  flex: 1;
  border: none;
  border-top: 1px solid var(--border);
}

.switch {
  font-size: 0.9rem;
  text-align: center;
  color: var(--text-muted);
}

.switch a {
  color: var(--primary);
  font-weight: 700;
  text-decoration: none;
}

.switch a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>



<div class="card">

  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
  </div>

  <h2 id="form-title">Welcome back</h2>
  <p class="sub" id="form-sub">Sign in to your account</p>

  <div class="tab-bar">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Sign in</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">Register</div>
  </div>

  <!-- Login Form -->
  <div id="login-form">
    <div class="field">
      <label>Username</label>
      <input id="login-username" type="text" placeholder="Enter your username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input id="login-password" type="password" placeholder="••••••••" />
    </div>
    <button class="btn-primary" onclick="handleLogin()">Sign in</button>
  </div>

  <!-- Register Form -->
  <div id="register-form" style="display:none;">
    
    <div class="field">
      <label>Username</label>
      <input id="register-username" type="text" placeholder="Choose a username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input id="register-password" type="password" placeholder="••••••••" />
    </div>
    <button class="btn-primary" onclick="handleRegister()">Create account</button>
  </div>

  <div class="divider">
    <hr><span>or</span><hr>
  </div>

  <div class="switch" id="switch-text">
    New here? <a onclick="switchTab('register')">Create an account</a>
  </div>

</div>

<script>
function switchTab(tab) {
  var isLogin = tab === 'login';

  document.getElementById('login-form').style.display    = isLogin ? 'block' : 'none';
  document.getElementById('register-form').style.display = isLogin ? 'none'  : 'block';
  document.getElementById('tab-login').className    = 'tab' + (isLogin  ? ' active' : '');
  document.getElementById('tab-register').className = 'tab' + (!isLogin ? ' active' : '');
  document.getElementById('form-title').textContent = isLogin ? 'Welcome back'   : 'Create account';
  document.getElementById('form-sub').textContent   = isLogin ? 'Sign in to your account' : 'Join Business System today';
  document.getElementById('switch-text').innerHTML  = isLogin
    ? 'New here? <a onclick="switchTab(\'register\')">Create an account</a>'
    : 'Already have an account? <a onclick="switchTab(\'login\')">Sign in</a>';
}

async function handleLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value.trim();

  if (!username || !password) {
    return alert('Please enter both username and password.');
  }

  const response = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username, password})
  });

  const result = await response.json();
  if (!response.ok) {
    return alert(result.error || 'Login failed.');
  }

  sessionStorage.removeItem('margin_predictions');
  window.location.href = '/home';
}

async function handleRegister() {
  const username = document.getElementById('register-username').value.trim();
  const password = document.getElementById('register-password').value.trim();

  if (!username || !password) {
    return alert('Please enter username and password for registration.');
  }

  const response = await fetch('/api/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username, password})
  });

  const result = await response.json();
  if (!response.ok) {
    return alert(result.error || 'Registration failed.');
  }

  alert(result.message || 'Account created! You can now sign in.');
  switchTab('login');
}

function goBusiness() {
  window.location.href = 'prediction';
}
</script>

</body>
</html>

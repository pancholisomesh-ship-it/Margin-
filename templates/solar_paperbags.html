<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gross Margin Prediction — SolarBag</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d14;
  --surface: #14141f;
  --surface2: #1c1c2e;
  --surface3: #22223a;
  --border: rgba(255,255,255,0.07);
  --accent: #7c6fff;
  --accent2: #4ff8c8;
  --warn: #ffc600;
  --danger: #ff6b8a;
  --text: #f0eeff;
  --muted: #7b7a96;
  --card-radius: 16px;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem 1rem;
}

/* ── TOP BAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 900px;
  margin: 0 auto 2rem;
  padding: 0 0.25rem;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.icon-wrap {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: rgba(124,111,255,0.15);
  border: 1px solid rgba(124,111,255,0.3);
  display: flex; align-items: center; justify-content: center;
}
.icon-wrap svg { width: 22px; height: 22px; fill: var(--accent); }
.topbar-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.topbar-sub { font-size: 12px; color: var(--muted); }

.btn-back {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--muted); font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 500; cursor: pointer;
  text-decoration: none; transition: all 0.15s;
}
.btn-back:hover { color: var(--text); border-color: var(--border2, rgba(255,255,255,0.12)); }
.btn-back svg { width: 14px; height: 14px; fill: currentColor; }

/* ── MAIN LAYOUT ── */
.main-wrap {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 1.25rem;
  max-width: 900px;
  margin: 0 auto;
  align-items: start;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--card-radius);
  padding: 1.75rem;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
}

/* Toggle */
.toggle {
  display: flex; background: var(--surface2); border-radius: 10px;
  padding: 4px; margin-bottom: 1.5rem; gap: 4px;
}
.toggle-btn {
  flex: 1; padding: 9px; border: none; border-radius: 8px;
  background: transparent; color: var(--muted);
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.toggle-btn svg { width: 15px; height: 15px; }
.toggle-btn:hover { color: var(--text); }
.toggle-btn.active { background: var(--surface); color: var(--accent); border: 1px solid rgba(124,111,255,0.25); }

/* Form sections */
.form-section { display: none; animation: fadeUp 0.2s ease; }
.form-section.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.full { grid-column: 1 / -1; }

label {
  font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
}

.input-wrap { position: relative; }
.input-wrap span {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: 13px; color: var(--muted); pointer-events: none;
}

input[type="number"] {
  width: 100%;
  padding: 10px 13px 10px 26px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  -webkit-appearance: none;
}
input.no-prefix { padding-left: 13px; }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,111,255,0.12); }
input::placeholder { color: #3e3d5a; }

.btn-predict {
  width: 100%; padding: 12px; margin-top: 4px;
  background: linear-gradient(135deg, var(--accent), #5b4de8);
  color: white; border: none; border-radius: 10px;
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; letter-spacing: 0.02em;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: filter 0.15s, transform 0.1s;
}
.btn-predict:hover { filter: brightness(1.1); }
.btn-predict:active { transform: scale(0.98); }
.btn-predict svg { width: 16px; height: 16px; fill: white; }

/* Result */
.result-box {
  display: none; margin-top: 1.25rem;
  background: var(--surface2); border: 1px solid rgba(79,248,200,0.2);
  border-radius: 12px; padding: 1.25rem 1.5rem;
  animation: fadeUp 0.25s ease;
}
.result-box.show { display: block; }
.result-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.result-value { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800; color: var(--accent2); letter-spacing: -0.02em; }
.result-note { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* Redirect notice */
.redirect-notice {
  display: none;
  margin-top: 1rem;
  background: rgba(124,111,255,0.1);
  border: 1px solid rgba(124,111,255,0.3);
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 13px;
  color: var(--accent);
  align-items: center;
  gap: 10px;
}
.redirect-notice.show { display: flex; }
.redirect-notice svg { width: 16px; height: 16px; fill: var(--accent); flex-shrink: 0; }
.redirect-bar {
  height: 3px;
  background: rgba(124,111,255,0.2);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}
.redirect-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  width: 0%;
  transition: width 3s linear;
}

/* Charts */
.charts-row {
  margin-top: 1.5rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
.chart-wrap {
  position: relative;
  height: 200px;
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
  padding: 0.75rem;
}
.chart-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.result-breakdown { margin-top: 0.75rem; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rb-item { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 8px 10px; }
.rb-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.rb-val { font-size: 14px; font-weight: 600; margin-top: 2px; }

/* Error */
.error-box {
  display: none; margin-top: 1rem;
  background: rgba(255,107,138,0.08); border: 1px solid rgba(255,107,138,0.25);
  border-radius: 10px; padding: 0.85rem 1.1rem;
  font-size: 13px; color: var(--danger);
}
.error-box.show { display: block; }

/* Spinner */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── EXCEL TRACKER PANEL ── */
.excel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.excel-title { font-size: 13px; font-weight: 600; color: var(--text); }
.btn-export {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  background: rgba(79,248,200,0.1); border: 1px solid rgba(79,248,200,0.25);
  border-radius: 8px; color: var(--accent2);
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
}
.btn-export:hover { background: rgba(79,248,200,0.18); }
.btn-export svg { width: 13px; height: 13px; fill: var(--accent2); }

.entries-list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
.entries-list::-webkit-scrollbar { width: 4px; }
.entries-list::-webkit-scrollbar-track { background: transparent; }
.entries-list::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

.entry-item {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  animation: fadeUp 0.2s ease;
}
.entry-left { flex: 1; min-width: 0; }
.entry-type { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
.entry-type.solar { color: var(--warn); }
.entry-type.paper { color: var(--accent2); }
.entry-details { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-margin { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; flex-shrink: 0; }
.entry-margin.high { color: var(--accent2); }
.entry-margin.mid  { color: var(--warn); }
.entry-margin.low  { color: var(--danger); }

.entry-delete {
  background: transparent; border: none; color: var(--muted);
  cursor: pointer; font-size: 14px; padding: 2px 5px;
  border-radius: 4px; transition: color 0.15s, background 0.15s; flex-shrink: 0;
}
.entry-delete:hover { color: var(--danger); background: rgba(255,107,138,0.1); }

.empty-state { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 13px; }
.empty-state .empty-icon { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.4; }

.entries-count {
  font-size: 11px; color: var(--muted); margin-bottom: 0.75rem;
  display: flex; align-items: center; justify-content: space-between;
}
.entries-count span { color: var(--accent); font-weight: 600; }

@media (max-width: 720px) {
  .main-wrap { grid-template-columns: 1fr; }
  .topbar { flex-wrap: wrap; gap: 0.75rem; }
  .charts-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
    </div>
    <div>
      <div class="topbar-title">Margin Predictor</div>
      <div class="topbar-sub">AI-powered gross margin forecasting</div>
    </div>
  </div>
  <div style="display: flex; gap: 0.75rem;">
    <button class="btn-back" onclick="startNewUser()" style="background: rgba(255,107,138,0.1); border-color: rgba(255,107,138,0.25); color: var(--danger);" title="Clear current data and start fresh for a new user">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      New User
    </button>
    <a href="/dashboard" class="btn-back">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      Dashboard
    </a>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div class="main-wrap">

  <!-- LEFT: Prediction Form -->
  <div class="card">

    <!-- Toggle -->
    <div class="toggle">
      <button class="toggle-btn active" id="btn-solar" onclick="switchType('solar')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7zm0-5a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm0 18a1 1 0 0 1-1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1-1 1zM4.22 5.64a1 1 0 0 1 1.42-1.42l.7.71a1 1 0 0 1-1.41 1.41l-.71-.7zm13.14 12.72a1 1 0 0 1 1.42-1.42l.7.71a1 1 0 0 1-1.41 1.41l-.71-.7zM3 13h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm19 0h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zM5.64 19.78a1 1 0 0 1-1.41-1.41l.7-.71a1 1 0 0 1 1.42 1.42l-.71.7zm12.72-13.14a1 1 0 0 1-1.41-1.41l.7-.71a1 1 0 0 1 1.42 1.42l-.71.7z"/></svg>
        Solar Business
      </button>
      <button class="toggle-btn" id="btn-paper" onclick="switchType('paper')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/></svg>
        Paper Bags
      </button>
    </div>

    <!-- Solar Form -->
    <div class="form-section active" id="solar">
      <div class="field-grid">
        <div class="field full">
          <label>Name / Business</label>
          <div class="input-wrap">
            <input type="text" id="s_name" placeholder="e.g. Sharma Solar Co." />
          </div>
        </div>
        <div class="field">
          <label>Requirement (kW)</label>
          <div class="input-wrap">
            <input type="number" id="s_size" placeholder="e.g. 10" class="no-prefix" min="0">
          </div>
        </div>
        <div class="field">
          <label>Inverter Cost (₹)</label>
          <div class="input-wrap">
            <span>₹</span>
            <input type="number" id="s_inverter" placeholder="0" min="0">
          </div>
        </div>
        <div class="field">
          <label>Install Cost (₹)</label>
          <div class="input-wrap">
            <span>₹</span>
            <input type="number" id="s_install" placeholder="0" min="0">
          </div>
        </div>
        <div class="field">
          <label>Total Pricing (₹)</label>
          <div class="input-wrap">
            <span>₹</span>
            <input type="number" id="s_selling" placeholder="0" min="0">
          </div>
        </div>
        <div class="field">
          <label>No. of Plates</label>
          <div class="input-wrap">
            <input type="number" id="n_plates" placeholder="0" class="no-prefix" min="0">
          </div>
        </div>
        <div class="field">
          <label>Per Plate Cost (₹)</label>
          <div class="input-wrap">
            <span>₹</span>
            <input type="number" id="s_plates" placeholder="0" min="0">
          </div>
        </div>
      </div>
      <button class="btn-predict" onclick="predictSolar()">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>
        <span id="solar-btn-text">Predict Margin</span>
        <div class="spinner" id="solar-spinner"></div>
      </button>
    </div>

    <!-- Paper Form -->
    <div class="form-section" id="paper">
      <div class="field-grid">
        <div class="field full">
          <label>Name / Business</label>
          <div class="input-wrap">
            <input type="text" id="p_name" placeholder="e.g. Green Bag Ventures" />
          </div>
        </div>
        <div class="field">
          <label>Quantity (units)</label>
          <div class="input-wrap">
            <input type="number" id="p_qty" placeholder="e.g. 500" class="no-prefix" min="0">
          </div>
        </div>
        <div class="field">
          <label>Selling Price (₹)</label>
          <div class="input-wrap">
            <span>₹</span>
            <input type="number" id="p_sell" placeholder="0" min="0">
          </div>
        </div>
        <div class="field">
          <label>Raw Material Cost (₹)</label>
          <div class="input-wrap">
            <span>₹</span>
            <input type="number" id="p_raw" placeholder="0" min="0">
          </div>
        </div>
        <div class="field">
          <label>Labor Cost (₹)</label>
          <div class="input-wrap">
            <span>₹</span>
            <input type="number" id="p_labor" placeholder="0" min="0">
          </div>
        </div>
        <div class="field">
          <label>Delivery Cost (₹)</label>
          <div class="input-wrap">
            <span>₹</span>
            <input type="number" id="p_pack" placeholder="0" min="0">
          </div>
        </div>
      </div>
      <button class="btn-predict" onclick="predictPaper()">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>
        <span id="paper-btn-text">Predict Margin</span>
        <div class="spinner" id="paper-spinner"></div>
      </button>
    </div>

    <!-- Result Box -->
    <div class="result-box" id="result-box">
      <div class="result-label">Predicted Gross Margin</div>
      <div class="result-value" id="result-value">—%</div>
      <div class="result-note" id="result-note"></div>

      <div class="charts-row">
        <div class="chart-wrap">
          <div class="chart-label">Margin vs Cost</div>
          <canvas id="marginPieChart"></canvas>
        </div>
        <div class="chart-wrap">
          <div class="chart-label">Cost Breakdown</div>
          <canvas id="costBreakdownChart"></canvas>
        </div>
      </div>

      <div class="result-breakdown" id="result-breakdown"></div>
    </div>

    <!-- Redirect Notice -->
    <div class="redirect-notice" id="redirect-notice">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>
      <div>
        <div>Prediction saved! Redirecting to Dashboard…</div>
        <div class="redirect-bar"><div class="redirect-bar-fill" id="redirect-bar-fill"></div></div>
      </div>
    </div>

    <!-- Error -->
    <div class="error-box" id="error-box"></div>
  </div>

  <!-- RIGHT: Excel Tracker -->
  <div class="excel-panel">
    <div class="card">
      <div class="excel-header">
        <div class="excel-title">📋 Entry Tracker</div>
        <button class="btn-export" onclick="exportToExcel()">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5z"/></svg>
          Export Excel
        </button>
      </div>
      <div class="entries-count">
        <span id="entry-count">0 entries</span>
        <button onclick="clearAll()" style="background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;" onmouseover="this.style.color='var(--danger)'" onmouseout="this.style.color='var(--muted)'">Clear all</button>
      </div>
      <div class="entries-list" id="entries-list">
        <div class="empty-state">
          <div class="empty-icon">📊</div>
          <p>Fill the form and predict to add entries.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ===================== DATA STORE ===================== */
let entries = JSON.parse(localStorage.getItem('sb_entries') || '[]');

function saveEntries() {
  localStorage.setItem('sb_entries', JSON.stringify(entries));
}

/* ===================== FORM SWITCH ===================== */
function switchType(type) {
  ['solar', 'paper'].forEach(t => {
    document.getElementById(t).classList.toggle('active', t === type);
    document.getElementById('btn-' + t).classList.toggle('active', t === type);
  });
  hideResult();
}

/* ===================== UI HELPERS ===================== */
function setLoading(btnTextId, spinnerId, loading) {
  document.getElementById(btnTextId).textContent = loading ? 'Predicting…' : 'Predict Margin';
  document.getElementById(spinnerId).style.display = loading ? 'inline-block' : 'none';
}

function hideResult() {
  document.getElementById('result-box').classList.remove('show');
  document.getElementById('error-box').classList.remove('show');
  document.getElementById('redirect-notice').classList.remove('show');
}

function showError(msg) {
  hideResult();
  const err = document.getElementById('error-box');
  err.textContent = '⚠ ' + msg;
  err.classList.add('show');
}

function ratingLabel(m) {
  if (m >= 40) return '🟢 Healthy margin';
  if (m >= 20) return '🟡 Moderate — consider reducing costs';
  if (m >= 0)  return '🔴 Low margin — review your pricing';
  return '🔴 Negative margin — costs exceed revenue!';
}

function marginClass(m) {
  if (m >= 40) return 'high';
  if (m >= 20) return 'mid';
  return 'low';
}

/* ===================== SHOW RESULT ===================== */
function showResult(margin, breakdown, chartData) {
  hideResult();
  destroyCharts();

  document.getElementById('result-value').textContent = margin.toFixed(2) + '%';
  document.getElementById('result-note').textContent = ratingLabel(margin);

  const bd = document.getElementById('result-breakdown');
  bd.innerHTML = (breakdown || []).map(b => `
    <div class="rb-item">
      <div class="rb-label">${b.label}</div>
      <div class="rb-val" style="color:${b.color || 'var(--text)'}">${b.value}</div>
    </div>
  `).join('');

  document.getElementById('result-box').classList.add('show');

  if (chartData) {
    setTimeout(() => renderCharts(chartData), 50);
  }
}

/* ===================== REDIRECT TO DASHBOARD ===================== */
function redirectToDashboard() {
  const notice = document.getElementById('redirect-notice');
  notice.classList.add('show');

  // Start progress bar animation
  setTimeout(() => {
    document.getElementById('redirect-bar-fill').style.width = '100%';
  }, 50);

  // Redirect after 3 seconds
  setTimeout(() => {
    window.location.href = '/dashboard';
  }, 3000);
}

/* ===================== CHARTS ===================== */
let marginChartInstance = null;
let costChartInstance   = null;

function destroyCharts() {
  if (marginChartInstance) { marginChartInstance.destroy(); marginChartInstance = null; }
  if (costChartInstance)   { costChartInstance.destroy();   costChartInstance   = null; }
}

function renderCharts(chartData) {
  const pieCtx = document.getElementById('marginPieChart');
  if (pieCtx && chartData.margin_pie) {
    marginChartInstance = new Chart(pieCtx.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: chartData.margin_pie.labels,
        datasets: [{
          data: chartData.margin_pie.values,
          backgroundColor: ['#4ff8c8', '#ff6b8a'],
          borderColor: '#14141f',
          borderWidth: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: '#f0eeff', padding: 12, font: { size: 11 } }
          }
        }
      }
    });
  }

  const barCtx = document.getElementById('costBreakdownChart');
  if (barCtx && chartData.cost_breakdown) {
    costChartInstance = new Chart(barCtx.getContext('2d'), {
      type: 'bar',
      data: {
        labels: chartData.cost_breakdown.labels,
        datasets: [{
          label: 'Cost (₹)',
          data: chartData.cost_breakdown.values,
          backgroundColor: ['#7c6fff', '#4ff8c8', '#ffc600'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            max: 2000000,
            grid:  { color: 'rgba(255,255,255,0.08)' },
            ticks: { 
              color: '#7b7a96', 
              font: { size: 10 },
              callback: function(value) {
                if (value >= 1000000) {
                  return '₹' + (value / 1000000).toFixed(1) + 'M';
                } else if (value >= 100000) {
                  return '₹' + (value / 100000).toFixed(0) + 'L';
                } else {
                  return '₹' + value.toLocaleString();
                }
              }
            }
          },
          x: {
            grid:  { display: false },
            ticks: { color: '#7b7a96', font: { size: 10 } }
          }
        },
        plugins: { legend: { display: false } }
      }
    });
  }
}

/* ===================== ENTRY TRACKER ===================== */
function addEntry(entry) {
  entries.unshift(entry);
  if (entries.length > 100) entries.pop();
  saveEntries();
  renderEntries();
}

function renderEntries() {
  const list  = document.getElementById('entries-list');
  const count = document.getElementById('entry-count');
  count.textContent = entries.length + (entries.length === 1 ? ' entry' : ' entries');

  if (entries.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📊</div>
      <p>Fill the form and predict to add entries.</p>
    </div>`;
    return;
  }

  list.innerHTML = entries.map((e, i) => `
    <div class="entry-item" id="entry-${i}">
      <div class="entry-left">
        <div class="entry-type ${e.type}">${e.type === 'solar' ? '☀️ Solar' : '📄 Paper Bags'}</div>
        <div class="entry-details">${e.details}</div>
      </div>
      <div class="entry-margin ${marginClass(e.margin)}">${e.margin.toFixed(1)}%</div>
      <button class="entry-delete" onclick="deleteEntry(${i})" title="Remove">✕</button>
    </div>
  `).join('');
}

function deleteEntry(i) {
  entries.splice(i, 1);
  saveEntries();
  renderEntries();
}

function clearAll() {
  if (entries.length === 0) return;
  if (confirm('Clear all entries?')) {
    entries = [];
    saveEntries();
    renderEntries();
  }
}

/* ===================== NEW USER ===================== */
async function startNewUser() {
  if (confirm('Start a new user session? This will clear all previous data and reset the dashboard.')) {
    // Clear localStorage
    localStorage.removeItem('sb_entries');
    entries = [];
    
    // Clear session on server
    try {
      await fetch('/api/clear-session', { method: 'POST' });
    } catch (e) {
      console.log('Session clear request made');
    }
    
    // Refresh page to show fresh dashboard
    setTimeout(() => {
      window.location.href = '/prediction';
    }, 500);
  }
}

/* ===================== PREDICT SOLAR ===================== */
async function predictSolar() {
  hideResult();

  const customer_name  = document.getElementById('s_name').value.trim();
  const requirement_kw = Number(document.getElementById('s_size').value)     || 0;
  const inverter_cost  = Number(document.getElementById('s_inverter').value) || 0;
  const install_cost   = Number(document.getElementById('s_install').value)  || 0;
  const selling_price  = Number(document.getElementById('s_selling').value)  || 0;
  const no_of_plates   = Number(document.getElementById('n_plates').value)   || 0;
  const plate_cost     = Number(document.getElementById('s_plates').value)   || 0;

  if (!customer_name) {
    showError('Please enter a Name or Business for this prediction.');
    return;
  }
  if (!selling_price || selling_price <= 0) {
    showError('Please enter a valid Total Pricing greater than 0.');
    return;
  }

  setLoading('solar-btn-text', 'solar-spinner', true);

  const payload = { customer_name, requirement_kw, inverter_cost, install_cost, selling_price, no_of_plates, plate_cost };

  try {
    const res = await fetch('/predict_solar', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(payload)
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Server error');
    }

    const result = await res.json();

    // Show result with charts
    showResult(result.prediction, result.breakdown, result.chart);

    // Save to local tracker
    addEntry({
      type:      'solar',
      margin:    result.prediction,
      timestamp: result.timestamp,
      customer_name,
      details:   `${customer_name} • ${requirement_kw} kW • Total ₹${selling_price.toLocaleString()} • ${no_of_plates} plates`
    });

    // Redirect to dashboard after 3s
    redirectToDashboard();

  } catch (err) {
    showError('Prediction failed: ' + err.message);
  }

  setLoading('solar-btn-text', 'solar-spinner', false);
}

/* ===================== EXPORT TO EXCEL ===================== */
function exportToExcel() {
  if (entries.length === 0) {
    alert('No entries to export yet. Make some predictions first!');
    return;
  }

  const wb = XLSX.utils.book_new();

  const summary = entries.map(e => ({
    Type:             e.type === 'solar' ? 'Solar' : 'Paper Bags',
    Details:          e.details,
    'Gross Margin %': e.margin.toFixed(2),
    Rating:           e.margin >= 40 ? 'Healthy' : e.margin >= 20 ? 'Moderate' : 'Low',
    Timestamp:        e.timestamp
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), 'Summary');

  const date = new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb, `SolarBag_Predictions_${date}.xlsx`);
}
